[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "double"
indent-style= "space"

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "F", # Pyflakes
    "I", # import sorting
    "UP" # pyupgrade
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true